<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Weddies – Pagina niet gevonden</title>
<meta name="theme-color" content="#012417">
<link rel="icon" type="image/png" href="img/favicon-64.png">
<!-- 404 voor elk adres dat niet bestaat. Paden gaan via <base>: op weddiesapp.com is dat "/", zolang de site
     op github.io staat "/weddies-site/". -->
<script>document.write('<base href="' + (location.hostname.slice(-10) === "github.io" ? "/weddies-site/" : "/") + '">');</script>
<script>document.documentElement.classList.add("js");</script>
<link rel="stylesheet" href="style.css?v=22">
<style>
.fout { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 96px 16px 64px; }
.fout .merk { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); }
.fout-code { margin: 0 0 6px; color: var(--accent); font-weight: 800; font-size: 15px; letter-spacing: .3em; }
.fout h1 { font-size: clamp(34px, 6vw, 56px); margin: 0 0 14px; max-width: 14em; }
.fout p.uitleg { color: var(--zacht); font-size: 18px; max-width: 30em; margin: 0 0 30px; }
.fout .knop-store { text-decoration: none; }

/* De rode kaart, omhooggehouden door de scheidsrechter */
.kaartvlak { position: relative; width: 220px; height: 240px; margin-bottom: 18px; }
.kaartvlak .gloed { position: absolute; inset: 10px 0 0; border-radius: 50%; background: radial-gradient(closest-side, rgba(229, 57, 53, .35), rgba(229, 57, 53, 0)); }
.rodekaart {
  position: absolute; left: 50%; top: 22px; width: 118px; height: 168px; margin-left: -59px; border-radius: 12px;
  background: linear-gradient(155deg, #F0453F 0%, #D32F2F 45%, #A61B1B 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), inset 0 -2px 0 rgba(0, 0, 0, .15), 0 24px 40px rgba(0, 0, 0, .45);
  transform: rotate(-8deg);
}
.rodekaart::after { /* glans */
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: linear-gradient(115deg, rgba(255, 255, 255, .28) 0%, rgba(255, 255, 255, 0) 38%);
}
.fluitlijnen { position: absolute; left: 50%; top: 0; width: 220px; height: 240px; margin-left: -110px; overflow: visible; }
.fluitlijnen path { fill: none; stroke: rgba(249, 245, 235, .55); stroke-width: 3; stroke-linecap: round; }
@media (prefers-reduced-motion: no-preference) {
  .rodekaart { animation: kaarttrekken .9s cubic-bezier(.2, 1.4, .4, 1) both, kaartzweef 5s ease-in-out .9s infinite; }
  .fluitlijnen path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: fluit .5s ease-out .65s forwards; }
}
@keyframes kaarttrekken { from { transform: translateY(90px) rotate(-22deg); opacity: 0; } to { transform: rotate(-8deg); opacity: 1; } }
@keyframes kaartzweef { 0%, 100% { transform: rotate(-8deg) translateY(0); } 50% { transform: rotate(-6deg) translateY(-6px); } }
@keyframes fluit { to { stroke-dashoffset: 0; } }
</style>
</head>
<body class="voorpagina subpagina">
<div class="kaartlaag" aria-hidden="true"><div class="kaartlaag-in"><span class="pin p0" style="left:12%;top:18%"></span><span class="pin p1" style="left:78%;top:12%"></span><span class="pin p2" style="left:88%;top:46%"></span><span class="pin p3" style="left:8%;top:62%"></span><span class="pin p0" style="left:64%;top:74%"></span><span class="pin p1" style="left:35%;top:40%"></span><span class="pin p2" style="left:52%;top:22%"></span><span class="pin p3" style="left:24%;top:88%"></span></div></div>

<main class="fout">
  <a class="merk" href="./"><img src="img/logo.png" alt="" width="34" height="34">WEDDIES</a>
  <div class="kaartvlak" aria-hidden="true">
    <div class="gloed"></div>
    <svg class="fluitlijnen" viewBox="0 0 220 240"><path d="M34 70l-20-12"/><path d="M28 104H4"/><path d="M186 70l20-12"/><path d="M192 104h24"/></svg>
    <div class="rodekaart"></div>
  </div>
  <p class="fout-code">404</p>
  <h1 id="kop">Rode kaart voor deze link</h1>
  <p class="uitleg" id="tekst">Deze pagina bestaat niet of is verplaatst. Geen zorgen: op de voorpagina gaat het spel gewoon door.</p>
  <a class="knop-store" href="./" id="terug">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    <span id="knop">Terug naar het veld</span>
  </a>
</main>

<script>
(function () {
  var T = {
    nl: ["Weddies – Pagina niet gevonden", "Rode kaart voor deze link", "Deze pagina bestaat niet of is verplaatst. Geen zorgen: op de voorpagina gaat het spel gewoon door.", "Terug naar het veld"],
    en: ["Weddies – Page not found", "Red card for this link", "This page doesn’t exist or has moved. Don’t worry, the game carries on over on the homepage.", "Back to the pitch"],
    de: ["Weddies – Seite nicht gefunden", "Rote Karte für diesen Link", "Diese Seite gibt es nicht oder sie wurde verschoben. Keine Sorge: Auf der Startseite geht das Spiel weiter.", "Zurück aufs Spielfeld"]
  };
  var taal = null;
  try { taal = localStorage.getItem("taal"); } catch (e) {}
  if (!T[taal]) taal = (navigator.language || "").slice(0, 2).toLowerCase();
  if (!T[taal]) taal = "en";
  var t = T[taal];
  document.documentElement.lang = taal;
  document.title = t[0];
  document.getElementById("kop").textContent = t[1];
  document.getElementById("tekst").textContent = t[2];
  document.getElementById("knop").textContent = t[3];
})();
</script>
</body>
</html>
